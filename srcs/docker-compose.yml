services:
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    volumes:
      - /home/rammisse/data/mariadb:/var/lib/mysql
    env_file:
      - .env
    networks:
      - docker_network
    restart: always
    healthcheck:
      test: ["CMD", "mysqladmin", "ping", "-h", "localhost"]
      interval: 5s
      timeout: 5s
      retries: 10
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    volumes:
      - /home/rammisse/data/wordpress:/var/www/html
    env_file:
      - .env
    depends_on:
      mariadb:
        condition: service_healthy
    networks:
      - docker_network
    restart: always
    healthcheck:
      test: ["CMD", "test", "-f", "/var/www/html/wp-config.php"]
      interval: 5s
      timeout: 5s
      retries: 10
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    ports:
      - "443:443"
    depends_on:
      wordpress:
        condition: service_healthy
    volumes:
      - /home/rammisse/data/wordpress:/var/www/html
    networks:
      - docker_network
    restart: always
networks:
  docker_network:
    driver: bridge
    name: inception-network
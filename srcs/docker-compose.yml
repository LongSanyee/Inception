services:
  nginx:
    build:
      context: ./requirements/nginx
      dockerfile: Dockerfile
    ports:
      - "443:443"
    depends_on:
      - wordpress
    networks:
      docker_network:
  mariadb:
    build:
      context: ./requirements/mariadb
      dockerfile: Dockerfile
    volumes:
      - /home/rammisse/data/mariadb:/var/lib/mysql
    networks:
      docker_network:
  wordpress:
    build:
      context: ./requirements/wordpress
      dockerfile: Dockerfile
    volumes:
      - /home/rammisse/data/wordpress:/var/www/html
    depends_on:
      - mariadb
    networks:
      docker_network:
  
networks:
  docker_network:
    ipam:
      driver: default
      config:
        - subnet: "10.56.1.0/24"